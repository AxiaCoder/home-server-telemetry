# Alertmanager : groupe les alertes de vmalert et les poste sur Slack.
#
# Rien de propre a une installation ici : les identifiants de canaux, la table
# tache → geste et le jeton du bot vivent dans alertmanager/local/, hors depot
# (voir alertmanager/local.tmpl.example et le README).

templates:
  # L'ordre compte : une definition du dossier local remplace celle du depot.
  - /etc/alertmanager/maison/*.tmpl
  - /etc/alertmanager/maison/local/*.tmpl

route:
  receiver: slack-alertes
  group_by: [famille]
  group_wait: 2m
  repeat_interval: 24h
  routes:
    - matchers: ['canal="urgent"']
      receiver: slack-urgent
      repeat_interval: 12h

receivers:
  - name: slack-alertes
    slack_configs:
      - &slack
        api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/maison/local/slack-token
        channel: '{{ template "canal.alertes" . }}'
        send_resolved: true
        title: ''
        text: '{{ template "maison.texte" . }}'
        fallback: '{{ template "maison.texte" . }}'
        color: '{{ template "maison.couleur" . }}'

  - name: slack-urgent
    slack_configs:
      - <<: *slack
        channel: '{{ template "canal.urgent" . }}'
